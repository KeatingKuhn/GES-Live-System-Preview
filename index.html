<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Share+Tech+Mono&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
  --gl:#f0d64e;--gm:#d7b740;--gd:#ab8024;
  --bk:#121212;--panel:#181818;--surf:#1e1e1e;--border:#2c2c2c;
  --wh:#fff;--dim:rgba(255,255,255,.78);--mut:rgba(255,255,255,.68);
  --gh:linear-gradient(90deg,#f0d64e,#d7b740,#ab8024);
  --gd2:linear-gradient(135deg,#f0d64e,#d7b740,#ab8024);
  --blue:#2389e0;--green:#22c55e;--orange:#f97316;--purple:#8b5cf6;
  --ft:'Lora',Georgia,serif;--fm:'Share Tech Mono',monospace;--fb:'Trebuchet MS',sans-serif;

  /* Type scale - mobile/tablet default. Desktop (>=1025px) overrides below.
     Sized up a notch across the board for a general-audience site where a
     lot of visitors are closer to 40-50 than 20. --fs-opt-compact-label/
     desc are a deliberate exception, held at the ORIGINAL --fs-opt-label/
     desc values instead of following them up - .opt-compact (the sizing
     sub-steps' option grid) is pinned to the attic panel's fixed 200px
     height with zero spare room, proven to fit exactly at those original
     sizes, so it can't follow the general bump without overflowing. */
  --fs-opt-label:14px;--fs-opt-desc:12.5px;--fs-opt-badge:9.5px;
  --fs-opt-compact-label:13px;--fs-opt-compact-desc:11.5px;
  --fs-attic-label:14px;--fs-attic-desc:12px;--fs-attic-steplabel:12px;
  --fs-step-eyebrow:10.5px;--fs-step-q:17px;--fs-step-hint:12.5px;
  --fs-info-btn:14px;--fs-info-body:13px;
  --fs-btn-back:13.5px;--fs-btn-next:14.5px;--fs-btn-skip:12.5px;
  /* Added for the accessibility pass below - same mobile/desktop pattern as
     the block above, for spots that were still hardcoded px (not fixed-
     height/zero-slack panels, so free to grow): the done-screen review grid
     (attic's variant is its own fixed 200px panel, see the comment above
     .done-review-grid in this file - it has overflow:auto though, so a
     bit more room here just means a bit more scroll, never clipping),
     the diagram's heat/cool preview toggle, the final price/considerations
     panel, and the quick-edit banner. */
  --fs-review-label:10px;--fs-review-val:12px;--fs-review-edit:10px;
  --fs-review-label-lg:13.5px;--fs-review-val-lg:16px;--fs-review-edit-lg:12.5px;
  /* Middle tier for the closet sidebar's now-2-column review grid: closet
     isn't the fixed-height/zero-slack panel attic's -compact pair exists
     for, so this stays clearly bigger than that, but the old -lg pair
     (sized for a single full-width column with room to spare) was wider
     than a 2-column cell needs, which just meant more wrapped lines - not
     more legible, just taller. This is still comfortably above the ~14px
     option-card label size used everywhere else in the wizard. */
  --fs-review-label-md:11.5px;--fs-review-val-md:13.5px;--fs-review-edit-md:11px;
  --fs-toggle-eyebrow:10.5px;--fs-toggle-label:12.5px;--fs-toggle-temp:15px;--fs-toggle-caption:9px;
  --fs-pricing-line:13.5px;--fs-pricing-meta:13px;--fs-pricing-fine:12.5px;
  --fs-restart:13px;--fs-quickedit:12.5px;--fs-quickedit-btn:12px;
  /* Closet's pricing sizing sub-steps ("How many separate HVAC systems...",
     "What size system...", "Want duct replacement priced too?") play the
     exact same "primary question" role .step-q plays for every other step,
     but were hardcoded to 14.5px flat on every viewport - only ~1px above
     --fs-pricing-line/-meta body copy right below them, so weight:600 was
     the only thing marking them as more important, and unlike --fs-step-q
     they never grew on desktop the way every other question in the wizard
     does. This is the closet (non-fixed-height, scrolls-by-design) sidebar
     only - attic's compact 13px stays untouched since it lives in the
     zero-scroll-slack 200px bar (see the --fs-opt-compact-* comment above). */
  --fs-pricing-q:15px;
  --info-btn-size:32px;
}
@media(min-width:1025px){
  :root{
    --fs-opt-label:17px;--fs-opt-desc:14.5px;--fs-opt-badge:10.5px;
    --fs-opt-compact-label:15.5px;--fs-opt-compact-desc:13.5px;
    --fs-attic-label:17px;--fs-attic-desc:14px;--fs-attic-steplabel:15px;
    --fs-step-eyebrow:12.5px;--fs-step-q:20px;--fs-step-hint:14.5px;
    --fs-info-btn:16px;--fs-info-body:14.5px;
    --fs-btn-back:15.5px;--fs-btn-next:16.5px;--fs-btn-skip:14px;
    --fs-review-label:10.5px;--fs-review-val:12.5px;--fs-review-edit:10.5px;
    --fs-review-label-lg:15px;--fs-review-val-lg:17.5px;--fs-review-edit-lg:13.5px;
    --fs-review-label-md:12.5px;--fs-review-val-md:14.5px;--fs-review-edit-md:12px;
    --fs-toggle-eyebrow:12px;--fs-toggle-label:14.5px;--fs-toggle-temp:17px;--fs-toggle-caption:10.5px;
    --fs-pricing-line:14.5px;--fs-pricing-meta:14px;--fs-pricing-fine:13.5px;
    --fs-restart:14px;--fs-quickedit:13.5px;--fs-quickedit-btn:13px;
    --fs-pricing-q:17px;
    --info-btn-size:36px;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Every interactive element in this file sets outline:none (to drop the
   default focus ring that clashed with the custom .sel/hover states) with
   no replacement anywhere - keyboard navigation had zero visual sign of
   which control had focus. :focus-visible only fires for keyboard focus,
   never a mouse/touch click, so this restores that without adding a ring
   around every option card someone taps or clicks. */
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gl);outline-offset:2px}
/* Standard visually-hidden-but-announced pattern - used for the wizard's
   step-change live region (see the aria-live div in app.js). Kept off
   screen without display:none/visibility:hidden, either of which would
   also hide it from assistive tech and defeat the point. */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* html/body get a definite height (not just min-height) and body is the
   positioning context, so the app shell below can use position:absolute
   instead of position:fixed. Fixed positioning inside an iframe is a
   long-documented iOS Safari bug (elements can un-stick or jump during
   scroll of the OUTER page, since Safari handles fixed-position layers
   inside a nested browsing context differently) - this tool never needs
   to scroll past its own box regardless, so absolute gives the identical
   on-screen result without that failure mode. */
html,body{height:100%}
body{position:relative;background:var(--bk);color:var(--wh);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0px,rgba(0,0,0,.025) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:9999}

/* PROGRESS - segmented by chapter (an "act" of the build), not one bare bar */
.prog-chapters{display:flex;gap:3px;height:4px;padding:0 2px}
.prog-chapter{flex:1;background:rgba(215,183,64,.1);border-radius:2px;overflow:hidden}
.prog-chapter-fill{height:100%;background:var(--gh);transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog-chapter.done .prog-chapter-fill{background:linear-gradient(90deg,var(--gm),var(--gl))}
/* --gh is a gradient (used for background/border-image contexts elsewhere
   in this file) and is not a valid value for `color` - a browser drops
   that declaration entirely, so this used to silently fall back to
   whatever color the surrounding label happened to inherit (rgba(215,
   183,64,.72) in the attic step label, var(--gm) in the closet step
   eyebrow) instead of ever actually painting. Pinned to --gl (the
   brightest, most legible solid stop in that gradient) so it always
   renders gold regardless of ancestor color, and reliably clears 4.5:1
   against both the attic bar and sidebar panel backgrounds. */
.chapter-tag{color:var(--gl);font-weight:700}

/* CANVAS */
.canvas-svg{width:100%;height:100%;position:absolute;inset:0}
/* Subtle blueprint grid behind the diagram - on wide screens the artwork's
   viewBox (fixed aspect ratio) doesn't fill a tall container, so this fills
   the letterboxed space with texture instead of a flat dead void. Purely
   decorative, sits behind the SVG (z-index unset, painted first), never
   touches diagram geometry. */
.canvas-frame{background-image:linear-gradient(rgba(215,183,64,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(215,183,64,.05) 1px,transparent 1px);background-size:44px 44px}
/* LIVE STATE TRANSITIONS - the thermostat-mode preview toggle (and any
   wizard answer that changes which equipment is drawn active) swaps a
   shape's fill/stroke/opacity attribute on every React re-render of the
   SAME element (no key change, no remount) - e.g. CONDENSER · ACTIVE vs
   STANDBY, ABSORBING/REJECTING HEAT vs STANDBY, the disconnect's status
   dot, a coil's glow. Without this, that swap was an instant attribute
   snap. Scoped to just the diagram's shape elements and just these three
   paint properties, so it only ever smooths an existing color/opacity
   change - it can't affect layout (nothing here is a layout property) and
   it never fires on first paint (a freshly-mounted element, e.g. behind
   .snap/.fadein's own entrance animation, has no prior value to
   transition from), so those entrance flourishes are untouched. Where a
   shape already carries its own keyframe `animation` for the same
   property (.spin, .airflow, .rain-drop, .glow-pulse's own pulse below),
   the animation simply takes precedence while it runs, per spec - no
   conflict either way. */
.canvas-svg :is(rect,circle,ellipse,path,line,polygon,text){transition:fill .22s ease,stroke .22s ease,opacity .22s ease}

/* DONE SCREEN - attic (wide/short diagram) keeps the review panel as a
   horizontal bar below so the canvas keeps full width; closet (tall/narrow
   diagram) keeps it as a side column so the canvas keeps full height. The
   sidebar's fixed 320px width doesn't shrink (flex-shrink:0), so on a
   narrow viewport a row layout squeezes the canvas to 0 - the mobile
   media query below overrides this to column for both. */
.done-screen{display:flex;overflow:hidden;transition:opacity .22s ease,transform .22s ease}
.done-screen.attic-mode{flex-direction:column}
.done-screen.closet-mode{flex-direction:row}
/* Clicking an EDIT chip drops `done` back to false to jump into the
   wizard - previously an instant unmount with nothing for a CSS
   transition to animate. App.js now keeps this screen mounted for one
   extra beat (see doneVisible/done-leaving in app.js) and adds this class
   for that beat, so it fades/settles out while .attic-layout/.closet-
   layout's own existing opacity transition fades the wizard in
   underneath - a crossfade instead of a hard cut. Never touches the
   done-screen's own entrance (canvasPowerOn/done-wrap's snap), which
   still fires exactly as before on the way IN. */
.done-screen.done-leaving{opacity:0;transform:scale(.985) translateY(4px);pointer-events:none}

/* Review-selections grid. Has to be a class, not the inline style it
   replaces - an inline style always beats a stylesheet rule, so a media
   query couldn't win otherwise.
   Base (and every width below the 1025px desktop tier, for BOTH modes -
   attic-mode-grid only overrides this at >=1025px, see below) is a plain
   fixed 2-column grid instead of the old auto-fill/minmax fluid count.
   Auto-fill picked a different column count at nearly every viewport
   width (3 at ~768px, 4 at ~1024px, ...), and because CSS Grid sizes
   column TRACKS for the whole grid (not per row), any build whose item
   count didn't divide evenly by that count left a literal blank
   cell-shaped hole in the final row - e.g. 10 items at 4 columns left 2
   empty cells bottom-right at 1024px. Locking to 2 caps the worst case at
   half a row, and the :last-child rule right below closes even that. */
.done-review-grid{grid-template-columns:repeat(2,1fr)}
/* Fills the final row instead of leaving a blank track when the grid's
   item count is odd for a 2-column layout (the sole item in that last
   row is also :last-child, at an odd 1-based position) - stretches it
   across both columns instead of a dead gap beside it. Was visible on the
   closet done-screen's review grid whenever an odd number of answers were
   set (e.g. 9 items: 4 full rows of 2, "Dehumidifier" alone with a blank
   cell-sized gap next to it right above the Get Pricing button). */
.done-review-grid>*:last-child:nth-child(2n+1){grid-column:1/-1}
@media(min-width:1025px){
  .done-review-grid.attic-mode-grid{grid-template-columns:repeat(5,1fr)}
  /* Same fix as the 2-column rule above, generalized to 5 columns: if the
     grid's item count isn't a multiple of 5, the last (partial) row's
     final item spans however many of the remaining columns are otherwise
     left blank, instead of a dead gap. Only actually fires for a build
     with a review-grid item count not divisible by 5 (7, 8, or 9 items -
     purif/system_for/extras are all optional/skippable); a 10-item build
     (this file's own zero-slack reference walkthrough) fills exactly 2
     full rows and never matches any of these. */
  .done-review-grid.attic-mode-grid>*:last-child:nth-child(5n+2){grid-column:span 4}
  .done-review-grid.attic-mode-grid>*:last-child:nth-child(5n+3){grid-column:span 3}
  .done-review-grid.attic-mode-grid>*:last-child:nth-child(5n+4){grid-column:span 2}
  .done-review-grid.attic-mode-grid>*:last-child:nth-child(5n+1){grid-column:1/-1}
}
/* Closet's sidebar is a genuinely scrolling column (not fixed-height like
   attic's bar), so the fix here is cutting how much of it there is to
   scroll through, not clipping anything. A single 200px-wide column of
   up to 10 rows was most of what made this screen "scroll a lot" - two
   columns roughly halves that, and 320px (the sidebar's fixed desktop
   width, and comfortably true on a phone-width mobile column too) fits
   two ~150px cells side by side with room for the EDIT button in each. */
.done-review-grid.closet-mode-grid{grid-template-columns:repeat(2,1fr)}
/* Review grid EDIT chips (both the attic-mode absolutely-positioned chip
   and the closet-mode inline one) previously had zero hover/press
   feedback at all - just a static inline-styled button with no CSS class
   to hang a :hover/:active rule on (and their color/background/border
   used to be set inline too, which - being inline - would have silently
   out-ranked any :hover rule added here; moved to this class instead so
   the states can actually win the cascade). Only ever changes
   background/border/text color and a tiny press scale, never a
   dimension, so it can't perturb either grid's layout or attic's
   zero-scroll-slack panel. */
.review-edit-btn{background:rgba(215,183,64,.1);border:1px solid rgba(215,183,64,.35);color:rgba(215,183,64,.85);font-family:var(--fm);cursor:pointer;letter-spacing:.05em;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .1s ease}
.review-edit-btn:hover{background:rgba(215,183,64,.22);border-color:rgba(215,183,64,.6);color:var(--gl)}
.review-edit-btn:active{transform:scale(.93);background:rgba(215,183,64,.3)}

/* Attic mode's "system is built" header lives over the canvas's dead
   letterboxed space on desktop (see the canvas-frame overlay in the
   done-screen JSX) but that space doesn't exist once the canvas drops to
   a short mobile strip - keep the original in-sidebar header there instead
   of stacking both. */
.done-header-desktop-only{display:none}
.done-header-mobile-only{display:flex}
@media(min-width:1025px){
  .done-header-desktop-only{display:flex}
  .done-header-mobile-only{display:none}
}

/* Attic-only: stretch to full width and left-align text instead of the
   base rule's centered column, since the wide/short attic panel reads
   as a stack of full-width cards, not a narrow centered column. The
   top-anchoring itself (justify-content) is now on the shared base rule
   above, not here - it isn't specific to attic's fixed-height panel. */
.done-wrap.done-wrap-attic{align-items:stretch;text-align:left}

/* The pricing sizing sub-steps' question/options split into a fixed
   420px-wide left column only makes sense once the attic panel is
   actually wide - on a phone-width viewport that fixed column pushes the
   options clean off-screen. Same fix as the review-grid override above:
   a class the inline atticMode style can't out-specificity, so this
   media query actually wins back below the sidebar's own mobile
   breakpoint. */
@media(max-width:860px){
  /* align-items stays "flex-start" inline (app.js) for attic's wide ROW
     layout, where it top-aligns two columns of differing height - a
     correct cross-axis (vertical) rule there. Once this same row flips to
     a COLUMN here, flex-start becomes a HORIZONTAL cross-axis rule instead:
     it shrinks {left}/{right} to their own content width rather than the
     container's full width, which silently squeezed the systems/ducts
     option grids into a single narrow column instead of using the real
     available width. */
  .pricing-substep-row{flex-direction:column!important;gap:8px!important;align-items:stretch!important}
  .pricing-substep-left{flex:1 1 auto!important}
  .pricing-opts-systems{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))!important}
  .pricing-opts-sqft{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))!important}
  .pricing-result-row{flex-direction:column!important}
}

/* ANIMATIONS */
.snap{animation:snap .45s cubic-bezier(.34,1.46,.64,1) both}
@keyframes snap{from{opacity:0;transform:translateY(-14px) scale(.93)}to{opacity:1;transform:translateY(0) scale(1)}}
.fadein{animation:fadein .3s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* pointer-events:none on draw/spin/airflow (and glow-pulse/line-pulse
   below) - all four are purely decorative animated marks (a duct's flow
   arrow, a fan's spin, a refrigerant line's pulse) layered on top of or
   inside a component's own hover-info zone, never a click/hover target in
   their own right. Without this, a stroked <path> (the airflow arrow's
   glow duplicate is 7px wide) sitting on top of a HoverInfo hit-rect
   swallows the pointer along its own thin line, leaving a dead strip
   where hovering shows nothing instead of the component underneath -
   found by hovering directly over the return duct's own flow arrow. */
.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:draw .7s ease forwards;pointer-events:none}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{animation:spin 4s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.airflow{stroke-dasharray:10 6;animation:airflow 2s linear infinite;pointer-events:none}
@keyframes airflow{to{stroke-dashoffset:-32}}
/* Rain/snow: each drop/flake carries its own --fx/--fy (total travel, set
   inline per-element from real zone geometry so the fall actually crosses
   the whole outside zone instead of a fixed few px) plus --op (its resting
   opacity, varied per depth layer) and --sway (snow only, side-to-side
   drift range). One shared keyframe per effect, individualized entirely
   through those custom properties - see OutsideZone in app.js. */
.rain-drop{animation:rainFall linear infinite}
@keyframes rainFall{
  0%{transform:translate(0,0);opacity:0}
  8%{opacity:var(--op,.7)}
  88%{opacity:var(--op,.7)}
  100%{transform:translate(var(--fx,0),var(--fy,40px));opacity:0}
}
.rain-splash{animation:rainSplash linear infinite}
@keyframes rainSplash{
  0%{opacity:0;transform:scale(.3) translateY(0)}
  10%{opacity:0}
  18%{opacity:var(--op,.7);transform:scale(1) translateY(0)}
  55%{opacity:0;transform:scale(1.9) translateY(-1.5px)}
  100%{opacity:0;transform:scale(1.9) translateY(-1.5px)}
}
.snow-flake{animation:snowFall linear infinite}
@keyframes snowFall{
  0%{transform:translate(0,0);opacity:0}
  6%{opacity:var(--op,.85)}
  25%{transform:translate(calc(var(--sway,8px) * -0.7),calc(var(--fy,200px) * 0.25))}
  50%{transform:translate(var(--sway,8px),calc(var(--fy,200px) * 0.5))}
  75%{transform:translate(calc(var(--sway,8px) * -0.4),calc(var(--fy,200px) * 0.75))}
  94%{opacity:var(--op,.85)}
  100%{transform:translate(0,var(--fy,200px));opacity:0}
}
/* Selecting an option is the single most-repeated gesture in the whole
   build - give it a tactile settle instead of an instant flat color swap. */
@keyframes selectPop{0%{transform:scale(1)}40%{transform:scale(1.035)}70%{transform:scale(.985)}100%{transform:scale(1)}}
@keyframes selectFlash{0%{background-color:rgba(240,214,78,.4)}100%{background-color:rgba(240,214,78,.05)}}
/* glowIn plays once on mount (an "active" component's glow dots/highlights
   are conditionally rendered - active&&<.../> - so toggling the thermostat
   preview mounts them fresh rather than changing an existing element's
   opacity) so a newly-active part eases in instead of popping straight to
   its mid-pulse brightness; gpulse then takes over, delayed to start right
   where glowIn leaves off (opacity .5) so there's no visible seam between
   the two. The always-running pulse itself is unchanged. */
.glow-pulse{animation:glowIn .22s ease-out both,gpulse 2.5s ease-in-out .22s infinite;pointer-events:none;transition:fill 2.5s ease-in-out}
@keyframes glowIn{from{opacity:0}to{opacity:.5}}
@keyframes gpulse{0%,100%{opacity:.5}50%{opacity:1}}
.line-pulse{animation:gpulse 2.2s ease-in-out infinite;pointer-events:none;transition:stroke 2.5s ease-in-out}
/* Mode-toggle (cool/heat pump/aux heat) "phase change" - color-driven
   parts (condenser body/text, coil colors, refrigerant labels) ease
   between states over the same ~2.5s window as the weather/sky fade
   below instead of snapping, so flipping the preview reads as a
   transition happening rather than a full redraw. */
.phase-color{transition:fill 2.5s ease-in-out,stroke 2.5s ease-in-out}
/* prefers-reduced-motion - the diagram runs several purely-decorative,
   NEVER-ending loops (a fan literally spinning forever, a refrigerant
   line's opacity pulsing forever, a duct's dashed flow arrow marching
   forever, rain/snow endlessly falling, the "rotate your phone" icon
   endlessly swiveling) with no way to turn them off and nothing lost by
   removing them - none of them carry information a static version
   doesn't already show (the diagram's own labels/arrows/colors say what's
   flowing where regardless). Sustained, repeating motion like this is
   exactly what prefers-reduced-motion exists to let someone opt out of
   (vestibular triggers), unlike the app's short (<1s) one-shot mount
   transitions elsewhere (fadein/snap/splashRise/etc.), which are left
   alone - scoped to the loops actually named in the a11y pass, not a
   blanket motion strip. Rain/snow are hidden outright rather than frozen
   mid-frame (animation:none would otherwise freeze them at whatever
   opacity/position their current animation cycle happened to be at,
   often 0% opacity - i.e. invisible anyway - or a half-fallen drop stuck
   mid-air, neither of which reads as intentional). glow-pulse/
   step-focus-ring keep their one-shot fade-IN (glowIn) but drop the
   infinite pulse after it, so an "active" part still visibly lights up,
   just without the endless breathing. */
@media (prefers-reduced-motion:reduce){
  .spin,.airflow,.line-pulse,.rotate-prompt-icon{animation:none!important}
  .rain-drop,.rain-splash,.snow-flake{display:none!important}
  .glow-pulse{animation:glowIn .22s ease-out both!important}
  .step-focus-ring{animation:glowIn .3s ease-out both!important}
  .phase-color,.line-pulse,.glow-pulse{transition:none!important}
}
/* Done-screen diagram is clickable - hover reveals which piece each
   component maps back to, so "edit this" doesn't require finding it in a list.
   The box-level ring this used to draw on hover (.edit-zone-ring) was
   removed - see EditZone's own comment in canvas.js - in favor of every
   individual sub-part's own HoverInfo ring (hover-info-panel below). */
.edit-zone{cursor:pointer}
.edit-zone rect:first-child{pointer-events:all}
/* Wizard "you are here" spotlight (StepFocusRing in canvas.js) - a pulsing
   dashed ring on whichever component the step CURRENTLY being asked is
   about. Deliberately reuses three animations already defined above rather
   than inventing a new one: glowIn+gpulse (the same one-shot-then-loop
   glow every "active" dot/highlight on this diagram already uses) for the
   opacity breathing, and the ductwork's own airflow march for the dashed
   stroke - a moving dash already reads as "this is live/in-progress"
   everywhere else in this diagram (supply/return duct arrows), so it
   carries that same meaning here instead of introducing a second visual
   language for the same idea. Never interactive (pointer-events:none) -
   this is a cue, not a control; the done screen's own EditZone above is
   what's actually clickable. */
.step-focus-ring{fill:none;stroke:rgba(215,183,64,.85);stroke-width:2.25;
  stroke-dasharray:9 6;pointer-events:none;
  animation:glowIn .3s ease-out both,gpulse 2.4s ease-in-out .3s infinite,airflow 1.4s linear infinite}

/* Thermostat COOL/HEAT face buttons (ThermModeButtons in canvas.js) - real
   hover feedback on top of their existing active/inactive fill+stroke
   swap. Colors match the same cool-blue/heat-orange the buttons (and the
   rest of the diagram's mode language) already use, and the glow itself is
   a drop-shadow rather than an SVG filter="url(#glow-sm)" reference so it
   doesn't collide with anything the button rects might pick up later -
   same idea as this file's own glow-pulse language, just expressed as CSS
   filter instead of an SVG <filter> since these are plain interactive
   rects, not one-shot-then-looping decoration. Inactive buttons are dimmed
   an extra notch (on top of their own dimmer fill/stroke) so "off" reads
   unambiguously at a glance, active or not, at any hover state. */
.therm-btn{transition:filter .15s ease-out,opacity .15s ease-out;cursor:pointer}
.therm-btn:not(.active){opacity:.6}
.therm-btn:hover{opacity:1}
.therm-btn-cool:hover{filter:drop-shadow(0 0 2.5px rgba(91,168,245,.95)) drop-shadow(0 0 1px rgba(91,168,245,.95))}
.therm-btn-heat:hover,.therm-btn-hp:hover,.therm-btn-furnace:hover,.therm-btn-aux:hover{filter:drop-shadow(0 0 2.5px rgba(249,115,22,.95)) drop-shadow(0 0 1px rgba(249,115,22,.95))}
/* Generic "what is this" hover tooltip (HoverInfo/HoverCtx/HoverPanel in
   canvas.js) - every individually-hoverable diagram part, in both the
   wizard and the done screen, at all times (not gated behind the diagram
   being finished). Unlike .edit-zone-ring above, the
   panel itself isn't CSS-revealed here - each hover zone reports its own
   mouseenter/mouseleave to one shared piece of React state (Canvas's own
   hoverPart) instead, so the single resulting panel can be rendered as
   the very last element in the whole <svg> and stay topmost regardless of
   which component triggered it (see that module comment for why a CSS
   sibling-reveal, which only stays on top of content painted BEFORE it,
   isn't enough here). This rule just keeps the panel from ever intercepting
   the pointer itself, as a defensive backstop alongside the inline style
   HoverPanel already sets.*/
.hover-info-panel{pointer-events:none}

/* SIDEBAR - overflow-y:auto, not hidden: the wizard sidebar (unlike the
   done-screen one, which gets an inline overflowY:auto override) had no
   scroll at all here, so a step with a lot of option text - or the info
   panel expanded on top of it - silently clipped whatever didn't fit,
   with the sticky nav row squeezed over the cut-off content instead of
   pinned below a scrollable one. Only mobile ever got this fixed. */
.sidebar{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;width:320px;flex-shrink:0;height:100%}
@media(max-width:860px){.sidebar{border-left:none;border-top:1px solid var(--border);max-height:none}}
/* Always-visible, on-theme scrollbar - a default OS scrollbar (especially
   the overlay style that only appears while actively dragging) is too easy
   to miss as a "there's more below" cue on a panel with no other affordance. */
.sidebar,.done-wrap{scrollbar-width:thin;scrollbar-color:rgba(215,183,64,.4) transparent}
.sidebar::-webkit-scrollbar,.done-wrap::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb,.done-wrap::-webkit-scrollbar-thumb{background:rgba(215,183,64,.35);border-radius:4px}
.sidebar::-webkit-scrollbar-track,.done-wrap::-webkit-scrollbar-track{background:transparent}

/* QUICK EDIT - editing one answer from the finished build, not restarting
   the wizard. Sits above the normal step header in both layouts. */
.quickedit-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:rgba(240,214,78,.08);border-bottom:1px solid rgba(215,183,64,.3);font-family:var(--fm);font-size:var(--fs-quickedit);color:var(--gl);flex-shrink:0}
.quickedit-banner button{background:none;border:none;color:rgba(215,183,64,.75);font-family:var(--fm);font-size:var(--fs-quickedit-btn);cursor:pointer;text-decoration:underline;padding:4px 0;letter-spacing:.02em}

/* STEP HEADER */
.step-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:10}
.step-eyebrow{font-family:var(--fm);font-size:var(--fs-step-eyebrow);color:var(--gm);letter-spacing:.2em;text-transform:uppercase;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.step-eyebrow::after{content:'';flex:1;height:1px;background:rgba(215,183,64,.15)}
.step-q{font-family:var(--ft);font-size:var(--fs-step-q);font-weight:600;color:var(--wh);line-height:1.3;margin-bottom:3px;text-align:center}
/* white-space:pre-line lets a hint's own \n characters force real line
   breaks (e.g. the indoor_type step's 3-clause hint) instead of only ever
   wrapping wherever the container happens to run out of width. */
.step-hint{font-size:var(--fs-step-hint);color:var(--mut);line-height:1.5;text-align:center;white-space:pre-line}
.reaction-line{font-size:var(--fs-step-hint);color:var(--gl);line-height:1.5;text-align:center;margin-top:4px;font-weight:600;animation:reactionIn .35s cubic-bezier(.34,1.56,.64,1) both}
@keyframes reactionIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
/* Done-screen "power on" reveal - nine small decisions lead here, and it's
   the one moment worth a real flourish instead of the same fade every
   other step gets. A brightness flash on the frame plus a diagonal light
   sweep over it, both one-shot on mount (this whole block only exists in
   the DOM once done=true, so there's no need to re-trigger manually). */
/* flex:1 lives here (not as an inline style in app.js) specifically so the
   mobile media query below can override it with flex:none - an inline
   style always beats a stylesheet rule regardless of specificity, which
   would otherwise silently defeat that override. */
.done-canvas-frame{flex:1;animation:canvasPowerOn .7s ease-out both}
@keyframes canvasPowerOn{0%{filter:brightness(1.7) saturate(1.35)}100%{filter:brightness(1) saturate(1)}}
.done-canvas-sweep{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.22) 47%,rgba(240,214,78,.4) 50%,rgba(255,255,255,.22) 53%,transparent 65%);
  background-size:280% 100%;background-position:160% 0;animation:powerSweep 1s cubic-bezier(.4,0,.2,1) both}
@keyframes powerSweep{0%{background-position:160% 0;opacity:0}12%{opacity:1}100%{background-position:-60% 0;opacity:0}}
/* Sized off a variable (not a fixed 28px) so it grows with the rest of the
   type scale on desktop - a bigger, easier-to-hit tap target, and the "i"
   glyph inside reads clearly at --fs-info-btn instead of feeling cramped in
   a small circle. It's also reachable by tap now (see the onTouchEnd/
   hoverCapable comment on this button in app.js) - a touchscreen has no
   hover state, so hover-only left phone/tablet users with no way at all to
   reach this panel's content; desktop keeps the exact no-click hover
   behavior it had before. */
/* transition is scoped to the properties :hover actually changes (border-
   color/color/background) rather than `all` - `all` also caught the
   button:focus-visible outline this button picks up from the global rule
   above, so Tab-ing onto it faded the focus ring in from 0 over the same
   .15s instead of showing it immediately, reading as no focus indicator at
   all for the first ~100ms a keyboard user landed here. Named properties
   leave the focus outline to snap in instantly, like every other control,
   while keeping the hover fade unchanged. */
.info-btn{width:var(--info-btn-size);height:var(--info-btn-size);flex-shrink:0;border-radius:50%;border:1.5px solid rgba(215,183,64,.55);background:rgba(215,183,64,.1);color:rgba(215,183,64,.9);font-family:var(--fm);font-size:var(--fs-info-btn);font-weight:700;cursor:pointer;outline:none;display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s,background .15s}
.info-btn:hover{border-color:var(--gl);color:var(--gl);background:rgba(215,183,64,.18)}
/* Info panel open/close - was a plain showInfo&&<div> conditional mount,
   so it snapped open and vanished instantly on close with no transition
   to animate (an unmounted element has nothing to transition from). Kept
   mounted in app.js now and animated instead via the CSS grid 0fr/1fr
   trick: a grid row that's always exactly the content's natural height
   when open and exactly 0 when closed, with overflow:hidden on the inner
   wrapper clipping it in between - so it eases open and closed from
   EITHER direction, never clips anything once fully open (the row is
   sized to the real content height, not a guessed max-height that could
   come up short for a longer INFO_TEXT entry), and never affects layout
   outside this element (a grid track's own row, nothing else moves except
   what already had to make room for this content in normal flow). */
.info-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;flex-shrink:0}
.info-collapse.open{grid-template-rows:1fr}
/* Suppresses the transition above for exactly one open - the unprompted
   auto-open on someone's first-ever visit to step 1 (see the app.js
   comment on autoInfoInstant). That animated reveal otherwise drags the
   option list down underneath a user who's likely about to tap the first
   card they see, for most of the .25s it takes; jumping straight to the
   final open height instead means the options are already exactly where
   they'll stay by the very first frame they're interactive. Every
   user-triggered toggle (hover/tap/focus) clears this class first and
   keeps the normal animated feel. */
.info-collapse.no-anim{transition:none}
.info-collapse-inner{overflow:hidden;min-height:0}
/* Desktop attic only: fixed open height instead of the shared 1fr
   (content-hugging) rule above. .attic-bar is a true fixed height there
   (see the comment on it), so .attic-bar-body's available height - and
   with it every option card's height, since they stretch to fill it -
   shrinks by exactly however much .info-collapse grows when opened. Info
   text length varies step to step (1 line vs 2), so with the shared 1fr
   rule that shrink amount varied per step too - hovering info made cards
   visibly different sizes depending on which question you were on, not
   because of anything about the cards themselves. Pinning this to the
   longest case (2 lines) means every step reserves the same amount of
   space and every card ends up the same height regardless of how much
   text that step's own info happens to have. Closet's sidebar isn't a
   fixed-height panel - opening info there just pushes .opts down in
   normal flow, no squeeze to make consistent - so it keeps the
   content-hugging 1fr behavior undisturbed. */
@media(min-width:1025px){
  .attic-info-collapse.open{grid-template-rows:52px}
}
.info-expand{padding:0 18px 10px}
.info-body{font-size:var(--fs-info-body);color:rgba(255,255,255,.68);line-height:1.45}

/* OPTIONS - .opt used to be flex:1, splitting the sidebar's full height
   equally across however many cards a step has. With only 1-2 short
   options in a tall closet sidebar that stretched each card to 300px+
   of mostly empty padding below its text - the vertical version of the
   same "dead box" bug fixed on the attic layout's horizontal option
   row. Sizing to content plus centering the leftover space keeps cards
   sized to what they actually say; overflow:hidden below still clips
   the rare step whose combined text is taller than the sidebar (same
   as the old flex:1 did when a card would have had to shrink below its
   content to fit), so this is never worse, only better once there's
   room to spare. */
.opts{padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:6px;flex:1;min-height:0}
.opt{background:var(--surf);border:1px solid var(--border);cursor:pointer;text-align:left;outline:none;-webkit-appearance:none;transition:border-color .15s,background .15s;position:relative;overflow:hidden;flex:0 1 auto;display:flex;align-items:stretch}
.opt:hover{border-color:rgba(215,183,64,.35);background:#1a1a1a}
.opt.sel{border-color:var(--gl);background:rgba(240,214,78,.05);animation:selectPop .32s cubic-bezier(.34,1.56,.64,1),selectFlash .55s ease-out}
.opt.sel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gh)}
.opt.disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.opt-inner{display:flex;align-items:flex-start;gap:10px;padding:11px 13px 11px 16px;width:100%;min-height:0}
.opt-body{flex:1;min-width:0;text-align:center}
.opt-label{font-family:var(--ft);font-size:var(--fs-opt-label);font-weight:600;color:var(--wh);display:block;margin-bottom:2px;line-height:1.3;white-space:normal}
.opt.sel .opt-label{color:var(--gl)}
.opt-desc{font-size:var(--fs-opt-desc);color:var(--dim);line-height:1.5;display:block}
/* .6 measured 4.67:1 against the card's settled selected background
   (rgba(240,214,78,.05) over --surf) - technically over 4.5 but with
   almost no margin, and during the ~0.55s selectFlash animation right
   after picking a card (background briefly much brighter gold) it dipped
   as low as ~2.9:1. .7 keeps the same "dimmed gold" selected look but
   clears the settled state at 5.8:1 and shortens how far the animated
   dip falls short. */
.opt.sel .opt-desc{color:rgba(240,214,78,.7)}
/* Tighter padding for the pricing sizing steps' option cards on the attic
   layout's short, wide panel - every px here is one this panel doesn't
   have to give up to a scrollbar. */
.opt-compact .opt-inner{padding:7px 10px}
.opt-compact .opt-label{margin-bottom:0;line-height:1.15;font-size:var(--fs-opt-compact-label)}
.opt-compact .opt-desc{line-height:1.25;font-size:var(--fs-opt-compact-desc)}
.opt-badge{display:inline-block;background:var(--gh);color:var(--bk);font-size:var(--fs-opt-badge);font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;margin-left:6px;vertical-align:middle}
.opt-check{width:21px;height:21px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;margin-top:2px;transition:border-color .15s,background .15s,color .15s}
.opt.sel .opt-check{border-color:var(--gl);background:var(--gm);color:var(--bk)}
/* A single-select step's indicator gets the "radio" class in the JSX
   (mirrors .attic-chk.radio on the attic layout) but nothing here ever
   made it round - every closet-mode option looked like a checkbox
   regardless of whether picking it replaced or added to the answer. */
.opt-check.radio{border-radius:50%}

/* Shared field styling for the pricing flow's two number inputs (sqft
   estimate on the sizing step, vent/register count on the ducts step) -
   previously each re-typed the same background/border/color inline, and
   the copies had drifted apart: sqft picked up the attic panel's
   .opt-compact-style padding/font cut, vent-count never did, so it stood
   taller than the Yes/No cards next to it in the same tight row. Same
   compact modifier both inputs now share keeps them matched to each
   other and to the option cards they sit beside. */
.pricing-input{width:100%;background:var(--surf);border:1px solid var(--border);color:var(--wh);font-family:var(--fm);box-sizing:border-box;padding:8px 10px;font-size:13px}
.pricing-input.compact{padding:3px 10px;font-size:11px}

/* NAV */
.nav-row{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--panel);position:sticky;bottom:0}
/* .btn-back sits directly beside .btn-next in every nav row (wizard bar,
   pricing sub-steps, done-screen quick actions) but only had a color/
   border transition - no transform at all, so next to .btn-next's hover
   lift + press it read as dead/unresponsive by comparison. Given the
   same hover lift and a scale-down :active to match, echoing the
   .review-edit-btn press pattern already used elsewhere on this screen. */
.btn-back{flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--mut);padding:11px 18px;font-family:var(--fb);font-size:var(--fs-btn-back);cursor:pointer;transition:border-color .2s,color .2s,transform .12s;outline:none}
.btn-back:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.55);transform:translateY(-1px)}
.btn-back:active{transform:scale(.96)}
.btn-next{flex:1;background:var(--gh);border:none;color:var(--bk);padding:12px 18px;font-family:var(--ft);font-size:var(--fs-btn-next);font-weight:700;cursor:pointer;letter-spacing:.04em;transition:opacity .2s,transform .12s;outline:none}
.btn-next:hover:not(:disabled){opacity:.85;transform:translateY(-1px)}
/* :active fires while a mouse held-down hover is also matched, and this
   rule comes after :hover so it wins - gives a distinct press "give"
   instead of the click just holding at the hover lift the whole time. */
.btn-next:active:not(:disabled){transform:scale(.96)}
.btn-next:disabled{opacity:.22;cursor:not-allowed;transform:none}
.btn-skip{background:transparent;border:none;color:rgba(255,255,255,.55);font-family:var(--fb);font-size:var(--fs-btn-skip);cursor:pointer;text-decoration:underline;outline:none;padding:4px;white-space:nowrap}
.btn-skip:hover{color:rgba(255,255,255,.75)}

/* DONE - justify-content:flex-start, not center: a centered flex column
   that overflows its container pushes its TOP content above the
   scrollable area, where overflow:auto's scrollbar can't reach it (a
   browser quirk with centered flex/grid overflow - it only ever exposes
   the bottom overflow). That's exactly what made "AS LOW AS $X/mo" -
   the very first thing in the pricing estimate - vanish above the
   visible closet sidebar on a build with enough line items to make the
   card taller than the panel. Previously fixed for the attic layout's
   done-wrap-attic variant only; the same overflow risk applies to any
   layout, so it belongs on the shared base rule instead. */
.done-wrap{padding:24px 18px;text-align:center;animation:snap .35s ease both;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.done-icon{width:54px;height:54px;background:var(--gh);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;color:var(--bk);font-weight:700}
/* Checkmark gets its own one-shot glow burst on TOP of done-wrap's snap
   pop-in above - the panel arriving is already covered by .snap; this
   marks the checkmark itself as the moment's actual payoff symbol, the
   same way the canvas gets its own dedicated power-on flash
   (canvasPowerOn/.done-canvas-sweep in app.js) instead of just fading in
   with everything else. One-shot (both, no infinite loop) - reads once
   and settles, matching the restrained treatment everywhere else in this
   file rather than an ongoing pulse that would nag at the eye. Wraps just
   the icon (not the whole header) so the halo stays centered on the
   checkmark regardless of how long the title text next to it runs. */
.done-icon-wrap{position:relative;display:inline-flex;flex-shrink:0}
.done-icon-wrap::before{content:'';position:absolute;inset:-9px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,214,78,.55) 0%,rgba(240,214,78,0) 72%);
  animation:doneIconGlow .8s ease-out .12s both;pointer-events:none}
@keyframes doneIconGlow{0%{opacity:0;transform:scale(.5)}45%{opacity:1}100%{opacity:0;transform:scale(1.65)}}
.done-title{font-family:var(--ft);font-size:19px;font-weight:700;color:var(--wh);margin-bottom:6px}
/* font-size used to be a flat 13px, so it never picked up the responsive
   bump --fs-restart got in the accessibility pass below - at >=1025px
   that left this primary "Resume My Build" CTA reading SMALLER than the
   plain text link right under it (.done-restart, "Start Fresh Instead"),
   inverting the intended primary/secondary size relationship. */
.done-cta{display:block;width:100%;background:var(--gh);border:none;color:var(--bk);padding:13px;font-family:var(--ft);font-size:var(--fs-restart);font-weight:700;cursor:pointer;letter-spacing:.04em;margin-bottom:8px;text-decoration:none;text-align:center}
/* Was rgba(255,255,255,.4) - measured well under the 4.5:1 contrast floor
   against the panel background (~3.8:1), so "Start Over"/"Start Fresh
   Instead" read as barely-there gray text for anyone with reduced contrast
   sensitivity. .62 clears 4.5:1 comfortably while staying visually
   secondary to the gold primary buttons around it. */
.done-restart{background:transparent;border:none;color:rgba(255,255,255,.62);font-family:var(--fb);font-size:var(--fs-restart);cursor:pointer;text-decoration:underline;outline:none;transition:color .15s}
.done-restart:hover{color:rgba(255,255,255,.85)}

/* "Edit selections" link - same gold text-button language as
   .review-edit-btn above (which already covers the review-grid EDIT
   chips' color/border/background/hover), just for the plain underlined
   link variant used in the pricing-flow header. */
.link-btn-gold{background:none;border:none;color:rgba(215,183,64,.85);font-family:var(--fm);letter-spacing:.04em;cursor:pointer;text-decoration:underline;padding:4px 0;transition:color .15s}
.link-btn-gold:hover{color:var(--gl)}

/* QUICK ACTIONS ROW (Financing / Save-Print / Start Over) - same gap as
   the EDIT chips above: three buttons with zero hover feedback, sitting
   right next to Back (.btn-back, which does have one) and Get Pricing
   (.btn-next, which does too). Colors match what was inline before;
   hover just intensifies each one's own existing tint instead of
   introducing a new accent. */
/* All three below had :hover but, unlike .review-edit-btn right above
   them on the same done screen, no :active - clicking gave a color/bg
   shift but no press "give", so next to the EDIT chips these four
   equally-weighted CTAs (per the QUICK ACTIONS comment above) felt
   inconsistent. Added a shared scale-down press, same .96 scale used by
   .btn-back/.btn-next, on a matching transform transition. */
.quick-financing-btn{background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.4);color:rgba(180,180,255,.9);transition:background .15s,border-color .15s,color .15s,transform .1s ease}
.quick-financing-btn:hover{background:rgba(99,102,241,.22);border-color:rgba(99,102,241,.7);color:#fff}
.quick-financing-btn:active{transform:scale(.96);background:rgba(99,102,241,.3)}
.quick-print-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.68);transition:background .15s,border-color .15s,color .15s,transform .1s ease}
.quick-print-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:rgba(255,255,255,.9)}
.quick-print-btn:active{transform:scale(.96);background:rgba(255,255,255,.15)}
.quick-restart-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.68);cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s ease}
.quick-restart-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.32);color:rgba(255,255,255,.9)}
.quick-restart-btn:active{transform:scale(.96);background:rgba(255,255,255,.16)}

/* ── PRICE REVEAL ── (overnight "more coolness" pass - the pricing flow
   itself, untouched by the other three delight-feature/visual-realism
   passes that ran the same night). Nothing here changes calcEstimate's
   math, the line items, or what's collected - purely presentation on top
   of numbers the app already computes.
   The monthly figure (.price-hero) is what a homeowner actually budgets
   against, so it gets its own nested card + a one-shot reveal glow;
   the one-time total right below it (plain markup in app.js, no class
   needed) stays the same CountUp/size treatment it already had, just
   demoted to "secondary" by sitting outside the hero box - deliberately
   NOT shrunk further or de-emphasized in color, since it's still a real
   number someone will want to read clearly, just not the FIRST number
   their eye lands on. */
.price-hero{position:relative;padding:14px 14px 12px;margin-bottom:12px;border:1px solid rgba(215,183,64,.4);background:rgba(240,214,78,.06)}
/* One-shot gold bloom around the hero card, timed to roughly track the
   monthly figure's own CountUp (900ms - see CountUp's default `duration`
   in canvas.js). Box-shadow rather than doneIconGlow's radial-gradient
   circle: that one halos a round checkmark, this one needs to bloom
   around a rectangular card, and reusing the exact same circular treatment
   here would read as a mismatched stamp instead of a deliberate answer to
   it. Same restrained one-shot-then-settle rule as every other glow in
   this file (glow-pulse/doneIconGlow above) - it marks the moment, then
   gets out of the way rather than nagging with an infinite pulse. */
.price-hero::before{content:'';position:absolute;inset:-1px;pointer-events:none;animation:priceHeroGlow .9s ease-out .15s both}
@keyframes priceHeroGlow{0%{box-shadow:0 0 0 0 rgba(240,214,78,0)}35%{box-shadow:0 0 26px 4px rgba(240,214,78,.35)}100%{box-shadow:0 0 0 0 rgba(240,214,78,0)}}
/* Wisetack's prequalify link, placed right inside the hero card instead of
   only down in the Quick Actions button grid - direction #4 of the polish
   pass: financing reads as part of the reveal moment itself (right under
   the monthly number it actually qualifies), not a same-weight button
   bolted on far below. Text-link, not another button - a second gold CTA
   stacked directly under the hero number would compete with it instead of
   supporting it. */
.price-hero-financing-link{display:inline-block;margin-top:8px;font-family:var(--fm);font-size:var(--fs-pricing-fine);color:rgba(215,183,64,.85);text-decoration:underline;transition:color .15s}
.price-hero-financing-link:hover{color:var(--gl)}
/* "Why this price" breakdown - base system vs. every add-on line summed
   together, both real numbers calcEstimate already produced (lines[0] is
   always the tonnage/system line; everything after it is an add-on the
   homeowner opted into) - nothing here is invented or independently
   rounded, basePct/addonsPct are derived from the same already-rounded
   `display` figures the line-item list below shows. Only rendered when
   there IS an add-on to compare against (see the addonLines.length check
   in app.js) - a 100%-base bar with nothing to contrast it against would
   be a chart with no story, worse than the plain list it would sit above. */
.price-breakdown{margin:2px 0 14px}
.price-breakdown-bar{display:flex;height:7px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.price-breakdown-seg{height:100%}
.price-breakdown-seg.base{background:var(--gh)}
.price-breakdown-seg.addons{background:rgba(255,255,255,.22)}
.price-breakdown-legend{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--fm);font-size:var(--fs-pricing-fine);color:var(--mut)}
.price-breakdown-dot{display:inline-block;width:7px;height:7px;margin-right:5px;vertical-align:middle}
.price-breakdown-dot.base{background:var(--gh)}
.price-breakdown-dot.addons{background:rgba(255,255,255,.35)}

/* ── SITE HEADER SPACER ── */
/* Blank reserved band at the top - no text/branding (that part was
   correctly dropped as a duplicate of the splash headline below it).
   This tool sits in an iframe under the real site's own sticky/fixed
   header on the live page - without this gap, that real header
   overlaps and hides the tool's own topmost content once the page is
   scrolled, since the iframe has no way to know the outer header is
   there and otherwise starts filling from y=0 - adjust to match the
   real site header's actual height if it differs. */
.site-header-spacer{position:absolute;top:0;left:0;right:0;height:43px;z-index:50;background:var(--bk);border-bottom:1px solid rgba(215,183,64,.2);box-sizing:border-box}
@media(min-width:641px){.site-header-spacer{height:42px}}

/* ── ADAPTIVE LAYOUT ── */
/* overflow:clip, not the more familiar overflow:hidden - this is a fixed,
   single-viewport app shell with no scrollbar of its own by design (every
   real scroll happens inside a nested region like .sidebar/.attic-bar,
   each independently overflow:auto). hidden still permits scrolling
   PROGRAMMATICALLY or via a focus() call the browser decides needs to
   "reveal" its target, even with no visible scrollbar and no user gesture
   able to trigger it - and this app moves focus around a lot (the
   step-advance/mode-switch focus-management effects elsewhere in
   app.js). On a short viewport, several of those in a row were measured
   nudging .app-root's own scrollTop up by 100-180px total (confirmed via
   scrollTop directly, not just a visual glitch) - once nonzero, nothing
   in the app ever resets it, so the ENTIRE shell stayed shifted that far
   off its own top for the rest of the session, most visibly on the done
   screen (canvas scrolled fully out of view above the fold, dead black
   space at the bottom) with no scrollbar for a user to fix it themselves
   even on a mouse. clip is the standard, purpose-built fix for exactly
   this gap in hidden: it still clips overflow and hides any scrollbar,
   but disallows scrolling entirely, by any means - this element was never
   meant to scroll at all. Unrelated to the scrollTop()/scrollIntoView
   calls made ON .app-root elsewhere in app.js, which scroll the OUTER
   page this widget is embedded in (an ancestor scrolling ITS descendant
   into view), not .app-root's own content - clip only governs the
   latter. */
.app-root{position:absolute;top:43px;right:0;bottom:0;left:0;display:flex;flex-direction:column;overflow:clip;background:var(--bk)}
@media(min-width:641px){.app-root{top:42px}}
/* Shrinks just the live diagram to fit its frame better on desktop,
   the way it looked right when tested at 75% browser zoom - wraps only
   the <Canvas> inside each canvas-frame (attic/closet wizard, done
   screen), NOT the wizard text/buttons around it, which stayed the
   normal size that was already tuned for readability; scaling those
   down too was making all the site's actual text small right along
   with the diagram, which is not what was wanted. transform (not zoom)
   because zoom actually recomputes descendants' layout at the scaled
   size - it re-ran every px-based calc through the 0.75 factor and
   rounding, which was enough to tip a fixed 200px-tall panel with zero
   scroll slack (built and tested that way deliberately elsewhere in
   this file) into a 1px scrollbar. transform only rescales the
   already-computed pixels at paint time, so nothing underneath ever
   computes anything different - same reason this is a plain wrapper
   around the Canvas instead of a style directly on its own root: that
   root measures its own box via getBoundingClientRect to size its
   SVG viewBox, and needs to see the box it's ACTUALLY being drawn into
   post-scale, not the pre-scale one. Scaling this wrapper up by 1/0.75
   first and back down by 0.75 nets out to exactly the canvas-frame's
   real box, just with the diagram itself drawn smaller inside it.
   Desktop only, same reasoning as the spacer above about mobile's
   vh-based sizing not needing this. */
.canvas-zoom{position:relative;width:100%;height:100%}
@media(min-width:641px){.canvas-zoom{width:133.3334%;height:133.3334%;transform:scale(.75);transform-origin:top left}}
/* ── ROTATE PROMPT ── Attic mode's diagram is wide/short by nature (the
   unit lies on its side, ductwork runs left-right) - the opposite shape of
   a portrait phone screen, and genuinely too condensed to read well there,
   unlike closet mode's tall/narrow diagram which already suits a phone.
   The JSX always renders this (see app.js) whenever isAtticMode is true;
   display:none here is what actually keeps it invisible everywhere except
   the one case it's for - a phone-width screen in portrait. max-width:700px
   matches this file's existing phone/tablet breakpoint convention (see
   compactToggle's own 700px reasoning in canvas.js) so a portrait TABLET
   (768px+, already confirmed to render the attic layout cleanly) is never
   caught by this, only real phones. No dismiss control - asked for
   directly, and turning the phone sideways is one physical motion away,
   not a dead end - covers the diagram completely (position:fixed, above
   everything) since a partial/translucent prompt would just be more
   clutter on top of the exact crowding it exists to solve. */
.rotate-prompt{display:none}
/* (pointer:coarse) is what actually scopes this to touch devices - the
   CSS orientation feature is computed purely from the viewport's own
   width-vs-height ratio, with no idea whether that viewport belongs to a
   phone or a resized desktop window, so a desktop browser shrunk taller
   than wide (a real, easy-to-hit case - direct feedback caught it)
   satisfied orientation:portrait + max-width:700px just as well as an
   actual phone did and popped this up over ordinary desktop use. Coarse-
   pointer (a finger, not a mouse) is true on phones/tablets and false on
   every desktop browser regardless of window size, rotate prompt or not. */
@media(orientation:portrait) and (max-width:700px) and (pointer:coarse){
  .rotate-prompt{display:flex;position:fixed;inset:0;z-index:100;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--bk);padding:32px;text-align:center}
  .rotate-prompt-icon{font-size:56px;color:var(--gl);animation:rotatePromptSpin 1.8s ease-in-out infinite}
  .rotate-prompt-text{font-family:var(--ft);font-size:22px;font-weight:700;color:var(--wh)}
  .rotate-prompt-sub{font-family:var(--fb);font-size:14px;color:rgba(255,255,255,.6);max-width:320px;line-height:1.5}
}
@keyframes rotatePromptSpin{0%,20%{transform:rotate(0)}50%,70%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
/* overflow-y:auto is a safety net for the max-height:800px rule below:
   centering (justify-content:center) splits any overflow evenly above AND
   below the box, and with no scroll affordance that top half - including
   the "BUILD YOUR OWN SYSTEM" title, this whole screen's own headline -
   was clipped off above the viewport with no way to reach it. Harmless
   here when content fits (the normal desktop case): no overflow, nothing
   to scroll. */
.splash-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:20;background:var(--bk);transition:opacity .5s,transform .5s;overflow-y:auto}
.splash-screen.out{opacity:0;pointer-events:none;transform:scale(.97)}
/* Splash content (title + intro copy + trust bullets + both location
   cards + language toggle) is tall enough that on any viewport under
   ~800px of HEIGHT - not just short-portrait phones (740/667px tall) but
   every phone in LANDSCAPE too (a 390-wide phone sideways is only ~390px
   tall) - it no longer fits centered without overflowing. Confirmed via
   getBoundingClientRect: on a portrait 360x740 the title's own box
   started at y=-35 (partly above the viewport); on any of our landscape
   phone widths (e.g. 844x390) the ENTIRE title box landed above y=0,
   fully off-screen with nothing on screen to indicate it existed, let
   alone reach it - centering splits overflow evenly above and below, and
   the overflow-y:auto safety net a few lines up can only help once
   there's a sensible, discoverable scroll direction to use. flex-start
   below anchors content to the top instead, so the title is always the
   first thing rendered and any overflow lands below - a normal,
   discoverable "scroll down for more" fold, the same pattern the wizard
   steps already use. 800px stays clear of the tallest known-fine case in
   testing (390x844 fits centered with only ~1px to spare) while safely
   covering every shorter case, including every landscape phone width
   tested. Must come after the base rule above, not just inside its own
   media query - same specificity, so source order alone decides which
   justify-content wins, and a plain .splash-screen rule anywhere later
   in the file would silently re-win this override back to center. */
@media(max-height:800px){
  .splash-screen{justify-content:flex-start;padding:24px 16px}
}
/* First-load entrance - the very first thing anyone sees gets a short,
   staged rise instead of popping in fully-formed in one frame. Each direct
   line/block gets .splash-rise plus its own small stagger (see the
   animationDelay inline on each one in app.js, same pattern already used
   for DehuErvBoxes'/the ionizer's per-item delays elsewhere in this app).
   Kept short (7 items, ~55ms apart, .4s each) and small (6px of rise) on
   purpose - this plays once per page load and nobody should be kept
   waiting to click the very first thing on the page; a slower or bigger
   version reads as ceremony, not polish. `both` so each element stays at
   its 0% frame (invisible) until its own delay elapses instead of all
   seven flashing visible-then-hidden-then-animating on frame one. Doesn't
   touch .splash-screen.out's own exit fade above - that's a different
   transition on a different property (the screen's own opacity/transform,
   not these children's), so the two never fight each other. */
.splash-rise{animation:splashRise .45s cubic-bezier(.22,.61,.36,1) both}
@keyframes splashRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.splash-logo{font-family:var(--ft);font-size:64px;font-weight:700;background:var(--gh);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.04em;text-align:center}
.splash-sub{font-family:var(--fm);font-size:13px;color:rgba(215,183,64,.65);letter-spacing:.22em;margin-top:-8px;text-align:center}
.trust-line{font-family:var(--fb);font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.02em;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.trust-line strong{color:rgba(215,183,64,.75);font-weight:600}
.trust-dot{color:rgba(255,255,255,.2)}
.splash-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
/* Named transition properties (background/border-color/transform), not
   `all` - see the .info-btn comment above for why: this card is also a
   [tabindex] focus-visible target (role="button"), and `all` delayed its
   focus outline in over the same .18s as the hover fade, instead of
   showing it the instant Tab lands here. */
.splash-card{width:360px;padding:28px 32px;background:rgba(215,183,64,.04);border:1px solid rgba(215,183,64,.15);cursor:pointer;transition:background .18s,border-color .18s,transform .18s;display:flex;justify-content:center}
.splash-card:hover{background:rgba(215,183,64,.09);border-color:rgba(215,183,64,.4);transform:translateY(-2px)}
/* First interactive control on the whole page, and clicking it kicks off
   a .5s screen fade (.splash-screen.out above) with nothing else marking
   the click in between - no :active state meant a slow/held click read
   as completely unresponsive for up to half a second. */
.splash-card:active{transform:translateY(-2px) scale(.97);background:rgba(215,183,64,.14)}
.splash-card-title{font-family:var(--ft);font-size:23px;font-weight:700;color:var(--wh)}
.splash-card-desc{font-family:var(--fb);font-size:14.5px;color:var(--mut);text-align:center;line-height:1.6}
/* Attic: canvas fills all, step bar on bottom */
.attic-layout{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .35s,transform .35s}
.attic-layout.out{opacity:0;pointer-events:none;transform:translateY(8px)}
.attic-canvas-area{flex:1;min-height:0;position:relative;overflow:hidden}
/* Fixed height (not min-height) on purpose - the bottom question bar reads
   as one stable panel across every step of the wizard, so its height
   shouldn't visibly shift depending on which question is showing or
   whether the info panel is open. Content (hint text, option descriptions)
   is trimmed per-step instead to fit inside this fixed box - see the
   per-step hint/desc text in the STEPS/getOpts definitions in app.js,
   sized to leave slack here even with the info panel open. Mobile already
   overrides this to height:auto (see the max-width:1024px block) so this
   only affects desktop/tablet-landscape behavior. */
.attic-bar{height:230px;flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column}
/* .attic-bar-top/.attic-info-collapse now come AFTER .attic-bar-body in
   the DOM (app.js) so Tab order runs question -> options -> Back/Skip/Next
   instead of hitting the nav row before the options it acts on - `order`
   restores the original top-to-bottom VISUAL stacking on top of that new
   DOM order. `order` only ever repaints; it never changes Tab order (a
   common trap - the DOM move above is what actually fixes that part), so
   both pieces are needed together. .quickedit-banner has no `order` set,
   so it keeps the default 0 and stays visually first either way. */
.attic-bar-top{order:1}
.attic-info-collapse{order:2}
.attic-bar-body{order:3}
/* Back/Next live here (not stacked inside .attic-info below) specifically
   so they're never subject to .attic-info's overflow:hidden - a long
   question+hint+reaction stack used to push Back past the fixed-height
   panel and clip it. Putting real nav buttons on this row means it can no
   longer stay a fixed 22px; it sizes to its content instead. */
.attic-bar-top{min-height:42px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:6px 12px;gap:8px}
.attic-bar-top .btn-back{padding:7px 14px;flex:0 0 auto}
.attic-bar-top .btn-next{flex:0 0 auto;width:auto;padding:8px 20px}
.attic-bar-body{flex:1;display:flex;min-height:0;overflow:hidden}
.attic-info{width:300px;flex-shrink:0;border-right:1px solid var(--border);padding:8px 18px;display:flex;flex-direction:column;gap:4px;overflow:hidden;justify-content:center}
.attic-scroll{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;align-items:stretch;gap:8px;padding:8px 12px;scrollbar-width:none}
.attic-scroll::-webkit-scrollbar{display:none}
/* Named transition properties (border-color/background), not `all` - same
   focus-outline-delay reasoning as .info-btn/.splash-card above. */
.attic-opt{flex:1;min-width:130px;max-width:280px;background:var(--surf);border:1px solid var(--border);cursor:pointer;padding:9px 12px;text-align:center;display:flex;flex-direction:column;gap:2px;transition:border-color .14s,background .14s;outline:none;-webkit-appearance:none;position:relative;overflow:hidden}
.attic-opt:hover{border-color:rgba(215,183,64,.3);background:#1a1a1a}
.attic-opt.sel{border-color:var(--gl);background:rgba(240,214,78,.05);animation:selectPop .32s cubic-bezier(.34,1.56,.64,1),selectFlash .55s ease-out}
.attic-opt.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gh)}
/* The sidebar's full-size option card (.opt) has a disabled state
   (opacity:.3 + cursor:not-allowed + pointer-events:none - see .opt.disabled
   above); this compact attic-bar equivalent never got the same rule, so an
   opt.disabled card rendered here looked identical to (and remained
   clickable as) a normal enabled one. Mirrors .opt.disabled exactly so the
   two card styles stay visually and behaviorally consistent. */
.attic-opt.disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.attic-opt-label{font-family:var(--ft);font-size:var(--fs-attic-label);font-weight:600;color:var(--wh);line-height:1.25}
.attic-opt.sel .attic-opt-label{color:var(--gl)}
.attic-opt-desc{font-size:var(--fs-attic-desc);color:var(--dim);line-height:1.4;flex:1;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden}
/* .attic-bar-top now sizes to content (not a fixed row) and shares space
   with Back/Info/Skip/Next, so a step whose question is long enough to
   wrap this label to 2 lines shouldn't be allowed to keep growing - the
   full question is already shown as its own heading right underneath. */
.attic-step-label{display:flex;font-family:var(--fm);font-size:var(--fs-attic-steplabel);color:rgba(215,183,64,.72);letter-spacing:.1em;flex:1;min-width:0;transition:font-size .2s}
/* Split into a protected "STEP N OF M" piece (never clipped) and a
   truncatable chapter+question piece - a narrow-viewport QA pass found
   the single nowrap+ellipsis span this used to be could drop the step
   counter entirely once neighboring buttons (info/back/next) left it too
   little room, worse in Spanish where the assembled string runs longer.
   The chapter tag + question text is safe to lose to an ellipsis since
   the full question already repeats as its own heading right below. */
.attic-step-label-fixed{flex-shrink:0;white-space:nowrap}
.attic-step-label-rest{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attic-opt-foot{display:flex;align-items:center;justify-content:center;margin-top:2px}
.attic-chk{width:18px;height:18px;border:1.5px solid rgba(215,183,64,.35);display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
.attic-opt.sel .attic-chk{border-color:var(--gl);background:var(--gm);color:var(--bk)}
.attic-chk.radio{border-radius:50%}
/* Closet: canvas left, sidebar right (unchanged) */
.closet-layout{position:absolute;inset:0;display:flex;flex-direction:row;transition:opacity .35s,transform .35s}
.closet-layout.out{opacity:0;pointer-events:none;transform:translateX(8px)}
.closet-canvas-area{flex:1;min-width:0;position:relative;overflow:hidden}

/* Option cards stay capped at 280px even when there's acres of row left
   over past 2-3 of them - widen the cap and center the row so leftover
   space reads as breathing room, not a dead gap next to the Next button.
   This was previously gated to min-width:1600px only, which left the
   dead gap on every ordinary 1025-1599px desktop/laptop width (the most
   common case) - starting it at the same 1025px breakpoint the rest of
   desktop-only styling uses fixes that without touching mobile/tablet.
   No overflow risk even on 3-option steps at the narrow end: .attic-opt
   is flex:1 (grow AND shrink) down to its 130px min-width, so 320px is
   only ever a cap, never a forced size. */
@media(min-width:1025px){
  .attic-scroll{justify-content:center}
  .attic-opt{max-width:320px}
}
@media(min-width:1600px){
  .attic-opt{max-width:360px}
  .attic-info{width:340px}
}
@media(min-width:2000px){
  .attic-opt{max-width:440px}
  .attic-info{width:380px}
}

/* ═══════════════════════════════════════════════
   MOBILE & TABLET RESPONSIVE (≤768px phone, ≤1024px tablet)
   Strategy: attic → vertical stack (canvas top, steps bottom scrollable)
             closet → vertical stack (canvas top, sidebar below)
             splash → single column tall cards
   Desktop layout is UNTOUCHED above 1024px.
   ═══════════════════════════════════════════════ */

@media(max-width:1024px){
  /* Splash: single column, stack cards vertically */
  .splash-cards{flex-direction:column;align-items:center;gap:12px}
  .splash-card{width:min(90vw,420px);padding:20px 22px}
  .splash-logo{font-size:clamp(28px,7vw,52px)}
  .splash-sub{font-size:11px;letter-spacing:.14em}

  /* Attic layout: canvas top 55%, bar bottom 45% scrollable */
  .attic-layout{flex-direction:column}
  /* Same dead-space bug as .done-canvas-frame below, same fix - a flat
     height:52vh (percentage of viewport HEIGHT only) ignores this frame's
     own WIDTH too. The live wizard canvas is a separate element from the
     done-screen's .done-canvas-frame (this one wraps the in-progress
     step-by-step diagram, live while answering questions; that one wraps
     the finished review diagram), so the aspect-ratio/max-height fix
     applied there never reached this one - on a portrait tablet
     (768x1024) this produced the exact same ~532px-tall box for a diagram
     that only needs ~300px at 768px wide, confirmed via
     getBoundingClientRect. Landscape phones (e.g. 844x390) are already
     handled by the separate max-height:430px rule further down (30vh,
     which lands well under the aspect-driven height here regardless), so
     they're unaffected by this change - max-height keeps the old 52vh as
     an upper bound either way. */
  .attic-canvas-area{flex:none;height:auto;aspect-ratio:2.5;max-height:52vh;min-height:220px}
  .attic-bar{height:auto;flex:1;min-height:0;overflow-y:auto}
  /* Back/Skip/Info/Next stay reachable without scrolling a long option
     list on a phone-height viewport - sticking this row is what replaces
     the old dedicated full-width bottom Next bar. */
  .attic-bar-top{position:sticky;top:0;z-index:2;background:var(--panel)}
  .attic-bar-body{flex-direction:column;overflow-y:auto;overflow-x:hidden}
  .attic-info{width:100%;border-right:none;border-bottom:1px solid var(--border);padding:10px 14px;flex-shrink:0}
  .attic-scroll{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;height:auto;flex:none;padding:8px 10px;gap:6px}
  .attic-opt{flex:1;min-width:calc(50% - 8px);max-width:100%;width:auto}

  /* Closet layout: canvas top 55%, sidebar below */
  .closet-layout{flex-direction:column}
  .closet-canvas-area{flex:none;height:52vh;min-height:220px}
  .sidebar{width:100%;height:auto;flex-shrink:0;border-left:none;border-top:1px solid var(--border);overflow-y:auto;max-height:45vh}
  /* The wizard's own sidebar (not the done-screen review panel, which also
     uses .sidebar but stays fine with the rule above - see below) needs
     its height tied to whatever room canvas-area's own min-height:220px
     actually left, not a flat 45vh: on a short landscape-phone viewport
     (e.g. 390px tall), 220px of forced canvas height plus a 45vh sidebar
     (175px of a 390px viewport) added up to more than the fixed-height,
     overflow:hidden .app-root had to give them (see its own comment
     further down) - the sidebar box itself got clipped at the viewport
     edge, taking the Back/Next row with it below the fold with no
     scrollbar (the page itself never scrolls, by design) able to reach it
     again. flex:1+min-height:0 mirrors .attic-bar's own fix for this same
     canvas-plus-bar-taller-than-the-screen shape a few lines up - the
     sidebar now only ever claims what's actually left after canvas-area,
     and falls back to its own overflow-y:auto (from the rule above) for
     anything past that, instead of silently overflowing the viewport.
     Scoped to .closet-layout so the done screen's own .sidebar (paired
     with a canvas-frame that's already flex:1/min-height:0 and so
     shrinks to make room instead of overflowing) is untouched. */
  .closet-layout .sidebar{flex:1;min-height:0;max-height:none}
  .opts{flex-direction:row;flex-wrap:wrap;overflow-y:auto;flex:none}
  /* Scoped to .opts .opt (the wizard sidebar's own option list), not a
     bare .opt - the pricing flow's Yes/No/duct-count row on the done
     screen reuses the same .opt class outside .opts, in a plain 3-item
     flex row with no wrap. A bare .opt selector here forced each of
     those into >=50% width too, so 2 buttons already claimed the full
     row and the third (the vent-count field) got squeezed to a sliver
     and silently clipped by the sidebar's overflow-x - never visible,
     never scrollable to. Scoping this to where it's actually meant to
     apply fixes that without changing the real 2-column wizard grid it
     was written for. */
  .opts .opt{flex:1;min-width:calc(50% - 6px);max-width:100%}
  /* Un-stuck, not re-affirmed sticky: a sticky .step-hdr up top plus a
     sticky .nav-row down here both pinned inside the same height-capped
     .sidebar is exactly the collision the max-height:430px block below
     already diagnoses in detail (see its own comment on .nav-row) and
     fixes with this identical position:static - but that fix only ever
     fired on a short/landscape viewport. On an ordinary tall portrait
     phone (iPhone-class, ~390x844) the canvas above still claims 52vh
     (see .closet-canvas-area a few lines up), and a step with enough
     content - cond_tier's three detailed tier cards plus its own intro
     line, measured here - still taller than what's left for .sidebar.
     Verified: with the old `position:sticky;bottom:0` here, the third
     tier card's own real layout position sat directly under the sticky
     Back/Skip/Next bar's opaque background - invisible, and a tap there
     landed on Next (disabled or not) instead of the card, on a totally
     mainstream phone size, not just the 430px edge case. Same fix, same
     reasoning, just not width-gated away from the phones it was written
     for: static here lets .nav-row flow to its natural spot right after
     the last option, same "scroll to the end to find Next" pattern the
     430px block already calls the expected mobile one. */
  .nav-row{position:static}

  /* Done screen - stack canvas above the review panel on narrow viewports
     regardless of layout. Matches the ".done-screen.attic-mode/.closet-mode"
     specificity above (two classes) so this actually wins in the cascade -
     an inline style would always beat any stylesheet rule here, which is
     why this used to be a no-op attribute-selector hack for the closet
     layout - flexDirection is no longer set inline at all. */
  .done-screen.attic-mode,.done-screen.closet-mode{flex-direction:column}
  /* Attic's done-screen canvas wrapper (.done-canvas-frame) has no height
     rule of its own - unlike the wizard's .attic-canvas-area above, it's
     bare flex:1 (see app.js), which happily fills whatever's left after
     the sidebar's fixed 200px (also set in app.js, for the review grid -
     see .done-wrap-attic). In this column layout that's most of the
     screen, but the attic diagram keeps a fixed ~2.5:1 aspect regardless
     of how tall its box is, so the extra height past what that aspect
     needs just sat there as dead black canvas background - pushing the
     "Your System is Built" header, review grid and every CTA below it
     (Get Pricing, Save/Print, Start Over) down past a phone screen's
     worth of empty scrolling before any of it was reachable. Capping it
     at the same 52vh the wizard's own canvas uses stops it from
