     outgrowing what the diagram actually needs. Closet's done-screen
     canvas doesn't get this because its own diagram is tall/narrow, not
     short/wide - flex:1 there already lands close to what it needs. */
  /* height:52vh alone (a flat percentage of viewport HEIGHT) ignores the
     frame's own WIDTH - on a portrait tablet (e.g. 768x1024) that's a
     532px-tall box for a diagram whose fixed ~2.5:1 aspect only actually
     needs ~300px at 768px wide, so ~230px of pure dead canvas background
     sat between the diagram and "Your System is Built" below it (confirmed
     via getBoundingClientRect - the diagram's own content stopped well
     short of the frame's bottom edge). A phone in landscape (e.g. 844x390,
     the case 52vh was originally tuned for) is wide enough relative to its
     height that 52vh already lands close to the aspect-driven height, so
     that case is unaffected. aspect-ratio makes the frame's height track
     its width directly - min-height keeps the old phone-portrait floor,
     max-height keeps the old 52vh as an upper bound so a very short/wide
     viewport can't make this taller than before. */
  .done-screen.attic-mode .done-canvas-frame{flex:none;height:auto;aspect-ratio:2.5;max-height:52vh;min-height:220px}
}

@media(max-width:600px){
  /* Phone: smaller canvas, single-column options */
  .attic-canvas-area{height:auto;aspect-ratio:2.5;max-height:45vh}
  .closet-canvas-area{height:45vh}
  .done-screen.attic-mode .done-canvas-frame{height:auto;aspect-ratio:2.5;max-height:45vh}
  .sidebar{max-height:50vh}
  .opts .opt{min-width:100%;max-width:100%}
  .attic-opt{min-width:100%;max-width:100%}
  /* Review grid back to 1 column below 600px - the fixed 2-column rule
     above (added to close the dead-gap hole a partial final row left at
     tablet widths) squeezes each attic-mode cell to ~170px at phone
     width, which is well under what that cell type was ever designed
     for: unlike closet's cells, attic's reserve a fixed 34px gutter on
     the right for an absolutely-positioned EDIT chip (see the review-grid
     cell markup in app.js), so at ~170px total width one-fifth of it is
     dead gutter before the label/value text even starts, driving heavier
     truncation than the same content got at any other width. Single
     column gives every cell the phone's full ~345px to work with, same
     as before the 2-column rule was introduced. */
  .done-review-grid{grid-template-columns:1fr}
  .splash-logo{font-size:clamp(22px,8vw,38px)}
  .splash-card{padding:16px 18px}
  .attic-bar-top .btn-skip{display:none}
  .step-hint{display:none}
}

/* Landscape phones: short viewport, but often well over 600px wide (an
   iPhone in landscape is ~850x390), so the max-width:600px rule above
   never fires for them and .step-hint stays at its full 3-line height.
   Closet's sticky .step-hdr (eyebrow + question + that hint) measured
   ~145px tall on a 390px-tall viewport once .closet-layout .sidebar was
   fixed (above) to actually respect the space canvas-area left it -
   taller than the ~128px that left for the whole sidebar, so the sticky
   header alone covered the entire visible sidebar no matter how far you
   scrolled, permanently hiding the options and Back/Next under it. Hiding
   the hint (step-q/eyebrow alone fit easily) helped but wasn't enough on
   its own: .sidebar's sticky header (still ~89px) and sticky nav-row
   (~66px) together still out-measured that ~128px box with nothing left
   in between for the actual options at ANY scroll position - the fixed
   220px-floor/52vh canvas above it was still claiming the same share of
   the viewport a portrait phone gets, despite a landscape phone having
   far less height to give it and, unlike portrait, plenty of spare width
   to render a short-but-wide diagram in instead. Shrinking the canvas
   floor here too (still an SVG that scales to fill whatever frame box it
   gets, per SVG_SCALE - never distorts or clips) is what actually buys
   the sidebar enough room for its two sticky bars plus real content
   in between. attic-info's own .step-hint shrinks the same way, though
   attic-bar's much shorter sticky bar was never at real risk of this. */
@media(max-height:430px){
  .step-hint{display:none}
  .attic-canvas-area{height:30vh;min-height:120px}
  .closet-canvas-area{height:30vh;min-height:120px}
  /* Shrinking the canvas above bought back real room, but .nav-row's own
     position:sticky;bottom:0 (set unconditionally, way up near .nav-row's
     base rule) turned out to be the other half of this bug: with .opts
     content still occasionally taller than the sidebar's own visible box
     on this step (indoor_type's auto-opened info panel pushes it further
     than most), a simultaneous sticky header AND sticky footer leave
     nothing but the space between them for that content to ever be seen
     in, and once combined they out-measured the box entirely, the
     Back/Next row rendered stuck on top of the option cards instead of
     below them - a real Next tap landed on whichever option happened to
     be under it. Un-sticking just the footer here is enough: it now
     flows to its natural spot right after the last option (an ordinary,
     expected mobile pattern - scroll to the end to find Next) and can
     never overlap anything, while .step-hdr stays sticky up top, which
     was never the problematic half - a lone sticky header just pins over
     space content is already flowing out from under, not space content
     still needs. */
  .nav-row{position:static}
}

/* PRINT - "Save / Print" only ever fires from the done screen's review/
   pricing panel, but that panel is built to be a fixed-height, internally
   scrolling box inside a fully-positioned (absolute/fixed) app shell -
   correct for an on-screen single-viewport app, but it meant
   window.print() only ever captured whatever currently fit inside that
   scroll box. Anything below the fold (the tail of a long line-item
   list, or the entire "Additional Considerations" panel on a build with
   enough add-ons) was silently absent from the printed page, not just
   visually clipped - there was no second page it flowed onto. Un-fixing
   the chain of positioned/overflow:hidden ancestors down to the sidebar
   lets its real content height flow into the printed document and
   paginate normally.
   The live diagram and every button that only makes sense on-screen
   (nav, EDIT, mode toggles, Get Pricing, Financing, Start Over) are
   dropped - nobody needs a page of clipped SVG or dead buttons, and the
   numbers are what a customer actually wants on paper. */
/* Full review grid rendered while pricing is engaged (see the
   print-only-grid wrapper in app.js) - invisible on-screen, since the
   collapsed one-line header already covers that case there, but this is
   what actually prints instead of just that one line once pricing has
   been opened. */
.print-only-grid{display:none}
.print-letterhead{display:none}
/* PRINT QA FIX - see the .price-live/.price-static comment in app.js next
   to the CountUp hero figures: on screen the live, animated number is what
   should show (.price-static stays hidden); only @media print below swaps
   them, so a print/PDF taken mid-animation still shows the correct settled
   total instead of whatever half-counted value the DOM had at that instant. */
.price-static{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important}
  .app-root,.done-screen,.sidebar,.done-wrap{
    display:block!important;position:static!important;overflow:visible!important;
    height:auto!important;max-height:none!important;width:100%!important;
    transform:none!important;
  }
  .print-only-grid{display:block!important}
  /* .done-canvas-frame (the finished diagram) used to be swept up by a
     blanket .canvas-frame rule here too - it carries that class alongside
     its own (see its className in app.js) since it reuses the same grid-
     background styling as the two WIZARD-step canvases this rule is
     actually meant to hide (.attic-canvas-area/.closet-canvas-area,
     neither ever visible on the done screen print starts from anyway).
     Targeting those two by their own class instead of the shared one
     lets the done-screen's diagram print - a comfort advisor sitting
     with a customer, printed diagram in hand, pointing at the actual
     parts while explaining them, is a real use case worth the extra
     page it costs. */
  .splash-screen,.attic-layout,.closet-layout,.attic-canvas-area,.closet-canvas-area{display:none!important}
  /* Printed on its own page ahead of the review grid/price - a full-
     width diagram and a dense text page don't share real estate well,
     and forcing them onto the same page would just squeeze both. Kept
     at its own aspect ratio (not stretched to fill the page) so the
     equipment layout still reads correctly instead of distorting. */
  .done-canvas-frame{display:block!important;width:100%!important;height:auto!important;aspect-ratio:2.5;max-height:80vh;page-break-after:always;margin-bottom:8px;border:1px solid #999}
  /* .prog-chapters (the gold segmented step-progress bar) sits at the App
     root, position:absolute, outside every element this block already
     hides - so it was never caught by those rules and printed as a stray
     gold bar pinned to the real page's top edge (its own position:absolute
     no longer has an absolutely-positioned ancestor to anchor to, once
     .app-root above is forced to position:static for print). It's
     on-screen wizard-progress chrome with no meaning on a printed price
     sheet, same category as the nav buttons already hidden below. */
  .prog-chapters{display:none!important}
  .sidebar{border:none!important}
  .done-wrap{animation:none!important}
  .btn-back,.btn-next,.btn-skip,.info-btn,.done-restart,.no-print{display:none!important}
  /* Floats as an absolute overlay pinned to the diagram's own top-left
     corner (see its style in app.js) - harmless on screen since it sits
     on top of open sky/attic space there, but now that the diagram
     actually prints (see .done-canvas-frame above) it would overlap real
     equipment art instead. Everything it says (system built, selections
     below) is already on the page via the letterhead/review grid, so
     it's dropped for print rather than repositioned. */
  .done-header-desktop-only{display:none!important}
  body,.done-wrap,.sidebar{color:#000!important;background:#fff!important}
  .done-wrap *{color:#000!important;border-color:#999!important}
  .done-title,.opt-label{color:#000!important}
  /* Closet mode's .done-wrap is centered on-screen (a deliberate narrow-
     column "receipt" look - see the base .done-wrap rule's own comment),
     but centered text is a print-legibility mistake on a full-width page:
     multi-line paragraphs (the disclaimers, the Additional Considerations
     copy) get a ragged-both-edges look that's genuinely harder to read
     than left-aligned. Attic's .done-wrap-attic variant already overrides
     to left on-screen for its own (unrelated) two-column-row reason: this
     just brings closet's print output in line with it, on paper only -
     the on-screen centered look is untouched. */
  .done-wrap{text-align:left!important}

  /* PRINT LETTERHEAD - see the comment on .print-letterhead in app.js for
     why this is a .sidebar child, not a .done-wrap one. Sits outside the
     rule above that flattens everything else in this document to black,
     so it keeps a small deliberate hit of the brand's gold - border-color
     (not a background-color/-image) always prints regardless of whether
     the browser's print dialog has "background graphics" checked, and
     plain text color always prints too, so neither needs the
     print-color-adjust escape hatch the breakdown bar below does need. */
  /* Kept deliberately tight (small margins/padding, no line-height above
     what the type needs) - a letterhead earns its place, but every extra
     px here is a px more likely to shove the last line of a longer build
     (more line items/add-ons = a taller price card) onto a mostly-blank
     second printed page. Measured against a 9-line-item closet build,
     the tallest realistic case this tool produces. */
  .print-letterhead{display:block!important;margin-bottom:4px;padding-bottom:3px;border-bottom:2px solid var(--gd)}
  .print-letterhead-brand{font-family:var(--ft);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:.05em;color:var(--gd)!important}
  .print-letterhead-sub{font-family:var(--fm);font-size:10px;line-height:1.3;color:#555!important;margin-top:1px;letter-spacing:.02em}

  /* Price-reveal additions, print-adapted: */
  .price-hero::before{content:none}
  /* Reveal glow is an on-screen-only flourish */
  .price-hero-financing-link{display:none}
  /* Already covered by .no-print above (see the className in app.js) -
     listed again here just as documentation of intent, not a second rule */
  /* The bordered/tinted box is a screen-only device for pulling the eye to
     the monthly figure first on a dark UI - on paper the same hierarchy
     already reads from size/weight alone (48px bold vs. the line items'
     ~12px), so the box costs real page-fit budget (border + padding) for
     no legibility gain in this medium. Dropped entirely rather than just
     shrunk, same "every px counts toward a second, mostly-blank page"
     reasoning as the letterhead above. */
  .price-hero{border:none;background:none;padding:0;margin-bottom:3px}
  /* The filled segmented bar leans on background-color, which (unlike
     border/text color) most browsers' print dialogs suppress by default
     unless "background graphics" is explicitly checked - so on a lot of
     real printouts this would silently be a blank sliver, not a bar. Long
     way of saying: don't gamble a real customer's printout on a checkbox
     they'll probably never see, let alone tick. The percentages are
     already restated as plain text in .price-breakdown-legend right below
     it, which prints reliably everywhere, so nothing is actually lost -
     and dropping the bar graphic itself also buys back real vertical
     room toward the one-page budget. */
  .price-breakdown-bar,.price-breakdown-dot{display:none}
  .price-breakdown{margin:0 0 2px}
  /* Hero's eyebrow/disclaimer margins are inline styles in app.js (sized
     for the on-screen box); overridden here with the same one-page-budget
     reasoning as everything else in this block. */
  .price-hero>div:first-child{margin-bottom:2px!important}
  .price-hero>div:nth-child(2)+div{margin-top:2px!important}
  .price-breakdown-legend{margin-top:0}
  /* .done-wrap's own padding (set inline in app.js) is sized for the
     on-screen scroll panel; trimmed here too toward the same one-page
     budget - print already dropped the panel's fixed height/scroll
     entirely (see the un-fixing comment above), so nothing but page count
     depends on this being generous. */
  .done-wrap{padding-top:4px!important;padding-bottom:2px!important}

  /* PRINT QA FIX - review-grid value truncation: attic's review grid
     ellipsis-clips a single-line value to fit its on-screen column width.
     On paper there's no hover, so the title="" tooltip that saves the
     on-screen case can't recover the cut text - a 4-item Add-ons combo
     ("...+ Surge Prote…") was confirmed printing mid-word-truncated with
     no way to read the full pick. Forcing a wrap here (any language)
     costs a couple of extra printed lines on wide combos, never loses
     content. Both languages now show the same shortened wording on screen
     too (see the big comment next to .review-val in app.js - English used
     to silently fall back to the long, unshortened value here), so this
     fires far less often in practice, but stays as a safety net for
     whatever residual combo still runs long in either language. */
  .review-val{white-space:normal!important;overflow:visible!important;text-overflow:clip!important}

  /* PRINT QA FIX - page-break splits: neither of these bordered boxes had
     any break-inside rule, so a box landing across a page boundary got
     its border/background cut mid-box - the bottom half re-opened as what
     reads like a second, unrelated bordered box at the top of the next
     page (confirmed on a build with enough add-ons to push the "A Few
     Other Things We Commonly Find" box across the page 1/2 boundary).
     break-inside:avoid pushes a box that doesn't fit onto the next page
     whole instead - costs some blank space at the bottom of the page
     before it, same trade already made everywhere else in this file in
     favor of not losing/garbling content. Also applied to each review-grid
     cell and the price card, for the same reason on a taller build. */
  .price-card,.considerations-block,.done-review-grid>*{break-inside:avoid}

  /* PRINT QA FIX - always show the settled final price, never a mid-count
     animation frame. See the .price-live/.price-static comment in app.js. */
  .price-live{display:none!important}
  .price-static{display:inline!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- The rest of the app (src/data.js, src/canvas.js, src/app.js) is
     bundled by esbuild, then inlined directly below by
     scripts/build-html.js as part of `npm run build` - the deployed
     index.html at the repo root needs nothing else: no app.js, no
     styles.css, no separate files to upload alongside it. Edit the
     source in src/ (or this template), never the built root
     index.html directly - it's regenerated on every build. -->
<script>// Built from src/ via npm run build - do not edit this file directly.
(() => {
  // src/data.js
  var CHAPTERS = ["THE BASICS", "THE ENGINE", "COMFORT", "FINAL TOUCHES"];
  var STEPS = [
    {
      id: "location",
      q: "Where's your indoor unit?",
      chapter: 0,
      hint: "Sets the layout of your whole system.",
      optional: false
    },
    {
      id: "indoor_type",
      q: "What Type of Indoor Unit?",
      chapter: 0,
      hint: "Furnace or air handler?\nFurnace = Gas Heat.\nAir Handler = All-Electric.",
      optional: false
    },
    {
      id: "insulation",
      q: "Fiberglass or spray foam?",
      chapter: 0,
      hint: "Determines your attic's construction - and furnace efficiency, if you have one.",
      optional: false
    },
    {
      id: "plenum",
      q: "New supply plenum needed?",
      chapter: 1,
      hint: "Feeds conditioned air to your ductwork.",
      optional: false
    },
    {
      id: "cond_tier",
      q: "Pick your efficiency tier.",
      chapter: 1,
      hint: "Higher efficiency, lower monthly bills.",
      optional: false
    },
    {
      id: "system_for",
      q: "Heat pump or straight cool?",
      chapter: 1,
      hint: "Heat pump does more; AC only cools.",
      optional: false,
      // Mid efficiency only comes as dual fuel - nothing to actually choose,
      // so skip the step entirely instead of showing a single-card question.
      showIf: (a) => a.indoor_type === "furnace" && a.cond_tier !== "mid_ge15"
    },
    {
      id: "thermostat",
      q: "Which thermostat?",
      chapter: 2,
      hint: "Wi-Fi models save 10\u201315% on your bill.",
      optional: false
    },
    {
      id: "purif",
      q: "Any add-ons?",
      chapter: 2,
      hint: "Filtration ships standard; add more here.",
      optional: true,
      multi: true
    },
    {
      id: "dehu",
      q: "Add a dehumidifier?",
      chapter: 2,
      hint: "Runs on its own; no buckets to empty.",
      optional: false
    },
    {
      id: "extras",
      q: "Any final add-ons?",
      chapter: 3,
      hint: "Condensate pump or ERV fresh-air system.",
      optional: true,
      multi: true
    }
  ];
  function deriveFurnaceEff(insulation) {
    return insulation === "spray" ? "e90" : "e80";
  }
  function getOpts(stepId, answers) {
    switch (stepId) {
      case "location":
        return [
          { v: "attic", label: "Attic", desc: "Horizontal install, the most common setup in Austin attics." },
          { v: "closet", label: "Closet", desc: "Upflow unit in a hallway or utility closet." }
        ];
      case "indoor_type":
        return [
          { v: "furnace", label: "Furnace - Gas Heat", desc: "Most common in Austin" },
          { v: "ah", label: "Air Handler - All Electric", desc: "Auxiliary heat installed" }
        ];
      case "insulation": {
        const isFurnace = answers.indoor_type === "furnace";
        return [
          {
            v: "fiberglass",
            label: "Fiberglass batts / blown",
            desc: isFurnace ? "Vented attic - pairs with an 80% AFUE furnace. Most Austin homes have this." : "Vented attic - most Austin homes have this."
          },
          {
            v: "spray",
            label: "Spray foam",
            desc: isFurnace ? "Sealed attic - needs a 90% AFUE furnace with a PVC flue. Cooler, more efficient." : "Sealed attic - cooler, more efficient."
          }
        ];
      }
      case "plenum":
        return [
          { v: "ductboard", label: "Ductboard plenum", desc: "Standard choice, good insulation. Typical lifespan 10\u201315 years." },
          { v: "metal", label: "Sheet metal plenum", desc: "More durable, lasts 25+ years, better for indoor air quality." },
          { v: "none", label: "Keep existing plenum", desc: "Good condition already - we connect directly, saving on labor." }
        ];
      case "thermostat":
        if (answers.cond_tier === "high_ge18") return [
          { v: "proprietary", label: "Communicating Thermostat", desc: "Required at this tier for precise staging and full diagnostics." }
        ];
        return [
